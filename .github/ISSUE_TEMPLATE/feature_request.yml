name: Feature request
description: Suggest a focused improvement to the example or CI workflows.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Explain the problem the change would solve and keep one idea per request.
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the use case, not just the implementation.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed improvement
      description: What behavior or outcome would you like to see?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional alternatives or tradeoffs.
